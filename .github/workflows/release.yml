name: release-CI

on:
  push:
    branches: 
      - release/**
    tags-ignore:
      - '**'
    paths-ignore:
      - 'README.md'

jobs:
  build:

    env:
      CONFIG: 'Release'
      SOLUTION: 'src/Ace.CSharp.Extensions.sln'
      TEST_PROJECT: 'src/Ace.CSharp.Extensions.Tests/Ace.CSharp.Extensions.Tests.csproj'

    permissions:
      id-token: write
      contents: read

    environment: release

    runs-on: ubuntu-latest

    steps:
    - name: Configure GIT
      run: git config --global core.autocrlf true

    - name: Checkout
      uses: actions/checkout@v6
    
    - name: Get build version
      run: |
        Import-Module .\.github\tools\get-build-version.psm1
        Write-Host $Env:GITHUB_REF
        $version = GetBuildVersion -VersionString $Env:GITHUB_REF
        echo "BUILD_VERSION=$version" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append
      shell: pwsh

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          6.0.x
          10.0.x
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/Directory.Build.props

    - name: Setup NuGet OIDC
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{secrets.NUGETUSER}}

    - name: dotnet restore
      run: dotnet restore $SOLUTION

    - name: dotnet format
      run: dotnet format $SOLUTION --verify-no-changes --severity info --no-restore

    - name: dotnet build
      run: dotnet build $SOLUTION --configuration $CONFIG -p:Version=$BUILD_VERSION --no-restore -warnaserror

    - name: dotnet test
      run: dotnet test $TEST_PROJECT --configuration $CONFIG --no-restore --no-build --verbosity normal

    - name: dotnet nuget push
      if: startsWith(github.ref, 'refs/heads/release')
      run: dotnet nuget push **\*.nupkg -s 'https://api.nuget.org/v3/index.json' --api-key ${{steps.login.outputs.NUGET_API_KEY}} --skip-duplicate
